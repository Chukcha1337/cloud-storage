services:

  redis:
    image: redis:7
    container_name: filestorage-redis
    ports:
      - "6379:6379"
    restart: always

  frontend:
    build:
      context: ./cloud-storage-frontend
      dockerfile: Dockerfile
    container_name: cloud-filestorage-frontend
    ports:
      - "8086:80"
    restart: always

  db:
    image: postgres:17
    container_name: filestorage-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: filestorage-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    restart: always

volumes:
  db_data:
  minio_data:
