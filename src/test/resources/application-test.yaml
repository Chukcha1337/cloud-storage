minio:
  url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: user-files
  root-user-directory: user-%d-files/

app:
  cors:
    allowed-origins: http://localhost:8086

spring:

  datasource:
    url:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        batch_size: 50
        show_sql: true
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: