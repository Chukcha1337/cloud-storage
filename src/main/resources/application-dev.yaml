spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cloud-filestorage
    username: chuckcha
    password: chuckcha
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        batch_size: 50
        show_sql: true
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

minio:
  url: http://localhost:9000
  access-key: chuckcha
  secret-key: chuckcha
  bucket-name: user-files
  root-user-directory: user-%d-files/