logging:
  level:
    root: INFO
  file:
    name: chuckcha.log
    path: /app/logs

server:
  servlet:
    session:
      timeout: 30m
  port: 8085

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

